# Railway deploy config for TripOS.
# The Dockerfile's default command runs src/agent/web.py (the starter example); this
# overrides it to run our TripOS web app instead.
#
# NOTE: Railway runs startCommand WITHOUT a shell, so "$PORT" would NOT expand.
# We don't pass --port at all — `fastapi run` reads the PORT env var that Railway
# injects, and already defaults --host to 0.0.0.0.
[deploy]
startCommand = "fastapi run src/agent/tripos_web.py"
