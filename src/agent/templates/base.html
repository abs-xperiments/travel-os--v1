<!doctype html>
<html lang="en" data-sky="dusk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TripOS — feel the trip before you take it{% endblock %}</title>
  <meta name="description"
        content="TravelOS is your AI travel companion — plan any trip on Earth and watch it become a beautiful, personal travel journal.">
  <meta property="og:title" content="TripOS — your journey begins at planning">
  <meta property="og:description"
        content="The world's first travel planner that feels like traveling. Plan any destination; receive a crafted travel journal.">
  <meta property="og:type" content="website">
  <!-- PWA: installable on Android/iOS/desktop from one codebase (no app store). -->
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#12142a">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TravelOS">
  <!-- Type: Fraunces = the journal's editorial voice, Inter = the quiet UI hand. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;650&display=swap"
        rel="stylesheet">
  <!-- HTMX (dynamic, no JS to write), Tailwind (utilities), marked (agent markdown).
       All via CDN — no build step. Design tokens + components live in theme.css. -->
  <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/journal.css">
  <script>
    // The sky follows the traveler's own hour — arriving at night feels like night.
    // A saved sky-dial choice (see chat header) overrides the clock until set back to auto.
    (function () {
      var pick = null;
      try { pick = localStorage.getItem('tripos_sky'); } catch (e) { /* private mode */ }
      if (pick && pick !== 'auto') { document.documentElement.dataset.sky = pick; return; }
      var h = new Date().getHours();
      document.documentElement.dataset.sky =
        (h >= 5 && h < 8) ? 'dawn' : (h >= 8 && h < 16) ? 'day'
        : (h >= 16 && h < 20) ? 'dusk' : 'night';
    })();
  </script>
  <style>.htmx-indicator{opacity:0;transition:opacity .2s}
    .htmx-request .htmx-indicator,.htmx-request.htmx-indicator{opacity:1}</style>
</head>
<body class="antialiased">
  <a class="skip-link" href="#main">Skip to content</a>
  <!-- The living world: sky, stars, clouds, terrain, a passing plane. Pure CSS,
       GPU-composited, stilled under prefers-reduced-motion. Decor only (aria-hidden). -->
  <div id="world" aria-hidden="true">
    <div class="w-stars"></div>
    <div class="w-clouds-far"></div>
    <div class="w-clouds"></div>
    <div class="w-shooting"></div>
    <div class="w-plane">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 15.5 13 11V4.75a1.25 1.25 0 0 0-2.5 0V11l-8.5 4.5v2l8.5-2.5v4.6l-2.3 1.6v1.3l3.55-1 3.55 1v-1.3l-2.3-1.6v-4.6l8.5 2.5v-2Z"/></svg>
    </div>
    <div class="w-terrain-far"></div>
    <div class="w-terrain"></div>
  </div>
  <div id="main" class="above-world">
  {% block body %}
  <main class="max-w-2xl mx-auto px-4 py-12">{% block content %}{% endblock %}</main>
  {% endblock %}
  </div>
  <script>
    // Render any new assistant bubbles (their raw markdown sits safely in a text node).
    // Recommendation links (Google-search redirects etc.) open in a new tab, safely.
    function safeLinks(el){
      el.querySelectorAll('a[href^="http"]').forEach(function(a){
        a.target = '_blank'; a.rel = 'noopener';
      });
    }
    function renderMarkdown(){
      document.querySelectorAll('.md[data-md]:not([data-done])').forEach(function(el){
        el.innerHTML = marked.parse(el.textContent);
        el.setAttribute('data-done','1');
        if (window.TripJournal) window.TripJournal.enhance(el);
        safeLinks(el);
      });
    }
    function scrollChat(){ var c=document.getElementById('chat'); if(c){ c.scrollTop=c.scrollHeight; } }
    document.addEventListener('DOMContentLoaded', function(){ renderMarkdown(); scrollChat(); });
    document.body.addEventListener('htmx:afterSwap', function(){
      renderMarkdown(); scrollChat();
      var f=document.getElementById('chat-form'); if(f){ f.reset(); }
    });
    // PWA: register the (tiny) service worker — required for installability.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(){ /* non-fatal */ });
    }
  </script>
</body>
</html>
