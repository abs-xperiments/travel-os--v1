{% extends "base.html" %}
{% block body %}
<div class="flex min-h-screen flex-col items-center justify-center px-4">
  <div class="w-full max-w-sm space-y-6 text-center">
    <div>
      <div class="text-3xl font-bold">👋 Welcome aboard</div>
      <div class="mt-1 text-sm text-slate-400">One quick thing before we plan.</div>
    </div>
    <form method="post" action="/welcome"
          class="rounded-2xl border border-slate-800 bg-slate-900 p-6 space-y-4">
      <label class="block text-left text-sm font-medium text-slate-200" for="name">
        What should we call you?
      </label>
      <input id="name" type="text" name="name" required autofocus maxlength="80"
        placeholder="Your name"
        class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100
               placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500">
      <button type="submit"
        class="w-full rounded-xl bg-sky-600 px-4 py-3 font-semibold hover:bg-sky-500 transition">
        Start planning →
      </button>
    </form>
  </div>
</div>
{% endblock %}
