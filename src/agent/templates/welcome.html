{% extends "base.html" %}
{% block title %}Welcome aboard — TripOS{% endblock %}
{% block body %}
<div class="flex min-h-screen flex-col items-center justify-center px-4">
  <div class="w-full max-w-sm space-y-6 text-center">
    <div>
      <div class="font-display text-3xl font-bold">Welcome aboard</div>
      <div class="mt-1 text-sm" style="color:var(--text-mid)">One quick thing before we plan.</div>
    </div>
    <form method="post" action="/welcome" class="glass p-6 space-y-4">
      <label class="block text-left text-sm font-medium" for="name"
             style="color:var(--text-hi)">What should we call you?</label>
      <input id="name" type="text" name="name" required autofocus maxlength="80"
        placeholder="Your name" class="field w-full px-4 py-3">
      <button type="submit" class="btn-primary w-full">Start planning →</button>
    </form>
  </div>
</div>
{% endblock %}
