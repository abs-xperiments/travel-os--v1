{# One conversation turn: the user's message (right, plain text) and the assistant's reply
   (left, rendered from markdown by base.html). Jinja escapes both as text, so neither can
   inject HTML; marked() only runs on the assistant bubble. #}
<div class="flex justify-end">
  <div class="max-w-[85%] whitespace-pre-wrap rounded-2xl bg-sky-600 px-4 py-3">{{ user_message }}</div>
</div>
<div class="flex">
  <div class="md max-w-[90%] rounded-2xl bg-slate-900 px-4 py-3" data-md>{{ reply }}</div>
</div>
